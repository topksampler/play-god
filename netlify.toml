# Netlify: static Vite build + one function for /api/*. Every push to main redeploys once the repo is linked.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Single-page app: unknown paths serve index.html (functions on /api/* take precedence).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
